# Cockpit's part of ~/.config/herdr/config.toml, merged by /cockpit:setup; keys already set in your config keep your value.
# ~/.config/cockpit/herdr is a link the plugin keeps on its current install folder.

[ui]
# One agent per space: the tab row only appears in a space holding several tabs.
hide_tab_bar_when_single_tab = true
sidebar_width = 34
# Attention queue: blocked and finished agents float to the top of the agent panel.
agent_panel_sort = "priority"

# Cockpit sends the system notifications itself, with its icon and a click that leads somewhere useful;
# herdr keeps its own as in-app toasts so none arrives twice.
[ui.toast]
delivery = "herdr"

# Spaces: the pinned ones by name, then the counts the cockpit mod reports on the inbox space.
[ui.sidebar.spaces]
rows = [
  # Only the pinned spaces, labelled "<icon>  <name>" (the two spaces tell them); agent spaces render blank, the agent panel below lists them.
  [{ token = "workspace", rules = [{ contains = "  " }, { contains = "", hide = true }] }],
  [{ token = "$review", dim = true }],
  [{ token = "$ci_fail", fg = "#FF8080" }, { token = "$ci_ok", dim = true }],
  [{ token = "$tickets", dim = true }],
  [{ token = "$limits", dim = true }],
  [{ token = "$todo", dim = true }],
  [{ token = "$runbook", dim = true }],
  [{ token = "$meetings", fg = "#FFC799" }],
  # The monitor space, when pinned: red when a release moved or failed or a monitor alerts.
  [{ token = "$monitor_bad", fg = "#FF8080" }, { token = "$monitor", dim = true }],
  # The actions space's sessions, one per line with its state; one waiting for you in the accent colour.
  [{ token = "$act_1", dim = true }, { token = "$act_1_wait", fg = "#FFC799" }],
  [{ token = "$act_2", dim = true }, { token = "$act_2_wait", fg = "#FFC799" }],
  [{ token = "$act_3", dim = true }, { token = "$act_3_wait", fg = "#FFC799" }],
  [{ token = "$act_4", dim = true }, { token = "$act_4_wait", fg = "#FFC799" }],
  [{ token = "$act_5", dim = true }, { token = "$act_5_wait", fg = "#FFC799" }],
  [{ token = "$act_6", dim = true }, { token = "$act_6_wait", fg = "#FFC799" }],
]

# Agents: state, task and the pane beside it, context percentage; under it repo · ticket, red when its PR fails CI.
[ui.sidebar.agents]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    # The agent's topic; with a pane beside it, split like a browser's split view: topic │ page +N.
    { token = "$agent", bold = true },
    { token = "$side_sep", dim = true },
    { token = "$side", fg = "#FFC799" },
    { token = "$ctx_ok", dim = true },
    { token = "$ctx_warn", fg = "#FFC799" },
    { token = "$ctx_hot", fg = "#FF8080", bold = true },
  ],
  [
    { token = "$work", dim = true },
    { token = "$work_run", fg = "#FFC799", dim = true },
    { token = "$work_fail", fg = "#FF8080" },
  ],
  [{ token = "$clash", fg = "#FF8080", bold = true }],
]

# The palette over the pane in view: every app's items, the week's events, past sessions and cockpit's commands; over a
# Claude session, a found item can go into it.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "sh ~/.config/cockpit/herdr/palette.sh"
description = "cockpit palette"

# The page of the terminal-browser beside the focused pane, in the default browser.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "sh ~/.config/cockpit/herdr/browse.sh --external"
description = "page beside, in the default browser"

# Jump to the pinned spaces.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh inbox"
description = "inbox space"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh terminal"
description = "terminal space"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh actions"
description = "actions space"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh to-do"
description = "to-do space"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh runbook"
description = "runbook space"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh meetings"
description = "meetings space"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "sh ~/.config/cockpit/herdr/focus-space.sh monitor"
description = "monitor space"
