id = "cockpit"
name = "Cockpit"
version = "0.40.3"
min_herdr_version = "0.7.5"
description = "See every coding agent you are running and what it is working on: one agent per space, any agent herdr runs, with pinned inbox, to-do, runbook, meetings, monitor, routines and mail spaces, PR peek popups, E2E tests in terminal-browser beside the agent"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "tab.renamed"
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "pane.moved"
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "workspace.created"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "workspace.moved"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "workspace.reordered"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "worktree.opened"
command = ["sh", "pin-spaces.sh"]

[[startup]]
command = ["sh", "pin-spaces.sh"]

[[startup]]
command = ["sh", "ensure-spaces.sh"]

[[events]]
on = "tab.focused"
command = ["sh", "recap-check.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "agent-status.sh"]

[[events]]
on = "workspace.closed"
command = ["sh", "ensure-spaces.sh"]

[[startup]]
command = ["sh", "prune-browsers.sh"]

[[startup]]
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "tab.created"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "tab.closed"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "tab.renamed"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "pane.moved"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "pane.closed"
command = ["sh", "cockpit.sh", "actions", "sidebar"]

[[events]]
on = "pane.closed"
command = ["sh", "prune-browsers.sh"]

[[panes]]
id = "peek"
title = "Peek"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "peek.sh"]

[[panes]]
id = "recap"
title = "Recap"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "recap.sh"]

[[panes]]
id = "agents"
title = "Agents"
placement = "popup"
width = "80%"
height = "75%"
command = ["sh", "cockpit.sh", "agents", "pick"]

[[panes]]
id = "queue"
title = "Queue"
placement = "popup"
width = "60%"
height = "50%"
command = ["sh", "cockpit.sh", "queue", "pick"]

[[panes]]
id = "palette"
title = "Cockpit"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "cockpit.sh", "palette"]
