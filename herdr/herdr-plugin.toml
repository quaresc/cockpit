id = "cockpit"
name = "Cockpit"
version = "0.12.0"
min_herdr_version = "0.7.5"
description = "One agent per space, pinned inbox, terminal, to-do, runbook and meetings spaces with their apps, PR peek popups, E2E tests in terminal-browser beside the agent"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "tab.renamed"
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "pane.moved"
command = ["sh", "sync-spaces.sh"]

[[events]]
on = "workspace.created"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "workspace.moved"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "workspace.reordered"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "pin-spaces.sh"]

[[events]]
on = "worktree.opened"
command = ["sh", "pin-spaces.sh"]

[[startup]]
command = ["sh", "pin-spaces.sh"]

[[startup]]
command = ["sh", "ensure-spaces.sh"]

[[events]]
on = "tab.focused"
command = ["sh", "recap-check.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "agent-status.sh"]

[[events]]
on = "workspace.closed"
command = ["sh", "ensure-spaces.sh"]

[[panes]]
id = "peek"
title = "Peek"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "peek.sh"]

[[panes]]
id = "recap"
title = "Recap"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "recap.sh"]
