# `cargo about generate --locked -o THIRD_PARTY_CRATES.md about.md.hbs`, run in herdr/tui, lists the crates built into
# the release binary with their licence texts. Order is preference: of a crate's choices, the first listed here wins.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "WTFPL",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
private = { ignore = true }
ignore-build-dependencies = true
workarounds = ["ring"]
