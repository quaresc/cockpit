# cockpit's apps, the hub they share and the commands the scripts call, all in the one `cockpit` binary, on the core crate.
[workspace]
resolver = "3"
members = ["core", "hub", "inbox", "runbook", "show", "todo", "meetings", "monitor", "update", "cli"]

[workspace.package]
version = "0.19.0"
edition = "2024"

[workspace.dependencies]
cockpit-core = { path = "core" }
cockpit-update = { path = "update" }
insta = "1"
ansi-to-tui = "8.0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
notify = "8.2.1"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
resvg = "0.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tachyonfx = "0.25.2"
textwrap = "0.16.4"
tui-tree-widget = "0.24.1"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
