[package]
name = "cockpit-cli"
description = "The `cockpit` command the plugin's scripts call: the actions space, notification buttons, the browser beside a pane, screenshots and the hub's health."
version.workspace = true
edition.workspace = true

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
cockpit-core.workspace = true
serde_json.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"
regex.workspace = true
