[package]
name = "cockpit-show"
description = "The view a Claude session shows beside itself: charts, tables, diagrams, pictures, diffs, logs and questions."
version.workspace = true
edition.workspace = true

[dependencies]
cockpit-core.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
textwrap.workspace = true
chrono.workspace = true
ratatui-image.workspace = true
image = { workspace = true, features = ["gif"] }
resvg.workspace = true
regex.workspace = true
tachyonfx.workspace = true
notify.workspace = true
signal-hook = "0.3.18"
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
comrak = { version = "0.59.0", default-features = false }
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
similar = { version = "3.2.1", features = ["unicode"] }

[dev-dependencies]
insta.workspace = true
proptest = "1.12.0"
