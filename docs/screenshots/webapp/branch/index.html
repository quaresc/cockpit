<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talent search · Acme</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body>
  <header>
    <div class="logo"><i></i>Acme Talent</div>
    <div class="avatar">CQ</div>
  </header>
  <main>
    <h1>Talent search</h1>
    <p class="lead">Find candidates across 2.4M profiles.</p>
    <div class="banner" role="alert">
      <span>⚠</span>
      <div><b>20 of 20 searches today</b>You can search again tomorrow. <a href="#plans">Raise your limit</a></div>
    </div>
    <div class="card">
      <label for="q">Role, skill or company</label>
      <input id="q" value="Frontend engineer">
      <div class="row"><span class="chip">Paris</span><span class="chip">3+ years</span><span class="chip">React</span></div>
      <button disabled>Search</button>
    </div>
    <div class="card">
      <h2>Saved searches</h2>
      <div class="saved">Frontend · Paris <span>128 new</span></div>
      <div class="saved">Data engineer · Remote <span>42 new</span></div>
      <div class="saved">Product designer · Lyon <span>9 new</span></div>
    </div>
  </main>
</body>
</html>
