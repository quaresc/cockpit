name: release

# A new version in plugin.json on main gets its tag and GitHub release, with its CHANGELOG.md section as notes.
on:
  push:
    branches: [main]
    paths: [plugin/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          herdr=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr/herdr-plugin.toml)
          if [ "$herdr" != "$version" ]; then
            echo "::error::herdr/herdr-plugin.toml is on $herdr, plugin.json on $version"
            exit 1
          fi
          awk -v head="## $version" '$0 == head || index($0, head " ") == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md |
            sed '/^$/d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
