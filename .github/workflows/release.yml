name: release

# Opens a pull request bumping every half to the next version, with its CHANGELOG.md section written from the commits
# since the last release. Merging it lets publish.yml tag the version and build its binaries.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump the version and write its changelog section
        id: cut
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(sh scripts/cut-release.sh "$BUMP")" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md plugin/.claude-plugin/plugin.json codex/.codex-plugin/plugin.json herdr/herdr-plugin.toml \
            herdr/tui/Cargo.toml herdr/tui/Cargo.lock
          git commit -m "$VERSION"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$VERSION" \
            --body "Merging this releases v$VERSION: the publish workflow tags it and builds its binaries. Edit the CHANGELOG.md section here first if it needs it."
