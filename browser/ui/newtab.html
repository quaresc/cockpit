<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>New tab</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 560px; margin: 12vh auto 0; padding: 0 24px; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p { margin: 0 0 20px; opacity: 0.7; }
      ul { list-style: none; margin: 0; padding: 0; }
      li a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; margin: 0 0 6px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 8px; color: inherit; text-decoration: none; }
      li a:hover { background: color-mix(in srgb, CanvasText 6%, transparent); }
      li span { opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      kbd { font: inherit; padding: 1px 5px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="name">New tab</h1>
      <p id="hint">Type an address above (<kbd>⌘L</kbd>), or open a server running in this worktree.</p>
      <ul id="servers"></ul>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
